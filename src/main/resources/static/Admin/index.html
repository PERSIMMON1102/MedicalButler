<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康生活动画展示</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.6.8/dist/css/layui.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #1E9FFF;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            font-size: 1.2rem;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
        }

        .health-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .health-card {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .health-card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 1.5rem;
            color: #1E9FFF;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .card-title i {
            margin-right: 10px;
            font-size: 1.8rem;
        }

        .animation-box {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
        }

        /* 心跳动画 */
        .heart {
            font-size: 80px;
            color: #ff6b6b;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 跑步动画 */
        .runner {
            font-size: 70px;
            color: #1E9FFF;
            animation: running 2s infinite linear;
        }

        @keyframes running {
            0% { transform: translateX(-50px); }
            100% { transform: translateX(50px); }
        }

        /* 食物动画 */
        .food {
            font-size: 70px;
            color: #5FB878;
            animation: rotating 4s infinite linear;
        }

        @keyframes rotating {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 睡眠动画 */
        .sleep {
            font-size: 70px;
            color: #FFB800;
            position: relative;
        }

        .sleep .moon {
            position: absolute;
            top: 0;
            left: 0;
            animation: moonMove 4s infinite alternate;
        }

        .sleep .stars {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 20px;
            animation: twinkle 2s infinite;
        }

        @keyframes moonMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(30px); }
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .progress-bar {
            height: 10px;
            background: #eee;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 5px;
            animation: fillProgress 2s ease-in-out forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .data-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 200px;
            margin: 10px;
            transition: transform 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #1E9FFF;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
            border-top: 1px solid #eee;
        }

        @media (max-width: 768px) {
            .health-card {
                min-width: 100%;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>健康生活动画展示</h1>
        <p>探索健康生活的各个方面，通过动画了解如何保持身心健康</p>
    </div>

    <div class="health-container">
        <div class="health-card">
            <div class="card-title">
                <i class="fas fa-heart"></i>
                <span>心脏健康</span>
            </div>
            <div class="animation-box">
                <div class="heart">
                    <i class="fas fa-heart"></i>
                </div>
            </div>
            <p>保持心脏健康是长寿的关键。定期运动、健康饮食和压力管理都有助于心脏健康。</p>
            <div class="progress-container">
                <div class="progress-title">
                    <span>健康进度</span>
                    <span>75%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 75%; background: #ff6b6b;"></div>
                </div>
            </div>
        </div>

        <div class="health-card">
            <div class="card-title">
                <i class="fas fa-running"></i>
                <span>运动健身</span>
            </div>
            <div class="animation-box">
                <div class="runner">
                    <i class="fas fa-running"></i>
                </div>
            </div>
            <p>定期运动可以增强免疫力，改善心情，帮助控制体重，并降低慢性疾病的风险。</p>
            <div class="progress-container">
                <div class="progress-title">
                    <span>运动进度</span>
                    <span>60%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 60%; background: #1E9FFF;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="health-container">
        <div class="health-card">
            <div class="card-title">
                <i class="fas fa-utensils"></i>
                <span>健康饮食</span>
            </div>
            <div class="animation-box">
                <div class="food">
                    <i class="fas fa-apple-alt"></i>
                </div>
            </div>
            <p>均衡饮食提供身体所需的所有营养素。多吃水果蔬菜，限制加工食品和糖分摄入。</p>
            <div class="progress-container">
                <div class="progress-title">
                    <span>饮食进度</span>
                    <span>85%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 85%; background: #5FB878;"></div>
                </div>
            </div>
        </div>

        <div class="health-card">
            <div class="card-title">
                <i class="fas fa-bed"></i>
                <span>优质睡眠</span>
            </div>
            <div class="animation-box">
                <div class="sleep">
                    <i class="fas fa-moon" class="moon"></i>
                    <div class="stars">
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                    </div>
                </div>
            </div>
            <p>充足高质量的睡眠对身心健康至关重要。成人每晚应睡7-9小时，保持规律的睡眠时间。</p>
            <div class="progress-container">
                <div class="progress-title">
                    <span>睡眠质量</span>
                    <span>70%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 70%; background: #FFB800;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="data-stats">
        <div class="stat-item">
            <div class="stat-icon" style="color: #1E9FFF;">
                <i class="fas fa-walking"></i>
            </div>
            <div class="stat-value">8,542</div>
            <div class="stat-label">今日步数</div>
        </div>

        <div class="stat-item">
            <div class="stat-icon" style="color: #5FB878;">
                <i class="fas fa-fire"></i>
            </div>
            <div class="stat-value">420</div>
            <div class="stat-label">消耗卡路里</div>
        </div>

        <div class="stat-item">
            <div class="stat-icon" style="color: #ff6b6b;">
                <i class="fas fa-heart"></i>
            </div>
            <div class="stat-value">72</div>
            <div class="stat-label">平均心率</div>
        </div>

        <div class="stat-item">
            <div class="stat-icon" style="color: #FFB800;">
                <i class="fas fa-cloud-moon"></i>
            </div>
            <div class="stat-value">7.5</div>
            <div class="stat-label">睡眠小时</div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.6.8/dist/layui.min.js"></script>
<script>
    layui.use(['layer', 'element'], function(){
        var layer = layui.layer;
        var element = layui.element;

        // 模拟加载进度
        element.progress('demo', '50%');

        // 卡片点击效果
        var cards = document.querySelectorAll('.health-card');
        cards.forEach(function(card) {
            card.addEventListener('click', function() {
                var title = this.querySelector('.card-title span').textContent;
                layer.msg('您点击了: ' + title, {icon: 1});
            });
        });

        // 统计数据动画
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // 页面加载完成后启动数字动画
        document.addEventListener('DOMContentLoaded', function() {
            const valueElements = document.querySelectorAll('.stat-value');
            animateValue(valueElements[0], 0, 8542, 2000);
            animateValue(valueElements[1], 0, 420, 2000);
            animateValue(valueElements[2], 0, 72, 2000);
            animateValue(valueElements[3], 0, 7.5, 2000);
        });
    });
</script>
</body>
</html>
