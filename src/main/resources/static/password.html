<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>修改密码</title>
    <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link href="https://cdn.jsdelivr.net/npm/layui@2.6.8/dist/css/layui.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/layui@2.6.8/dist/layui.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #3578c6;
            --text-color: #2b3a4a;
            --muted-color: #6b7685;
            --border-color: #e5eaf3;
            --bg-light: #fbfeff;
            --error-color: #ff4d4f;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft Yahei", Arial, sans-serif;
            background: #f5f7fb;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 16px;
            color: var(--text-color);
            line-height: 1.5;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            padding-top: 40px; /* 增加顶部内边距 */
        }

        .panel {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(30,40,60,0.08);
            padding: 24px 20px;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .panel-header .icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: #fff;
            font-weight: 700;
            font-size: 20px;
            flex-shrink: 0;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .panel-desc {
            color: var(--muted-color);
            font-size: 14px;
            margin-top: 4px;
        }

        .layui-form {
            padding-right: 0;
        }

        .layui-form-item {
            margin-bottom: 22px;
        }

        .layui-form-label {
            width: auto;
            font-weight: 500;
            color: var(--text-color);
            padding: 0 0 8px 0;
            text-align: left;
            display: block;
            font-size: 15px;
        }

        .layui-input-block {
            margin-left: 0;
            width: 100%;
        }

        .layui-input {
            border-radius: 10px;
            height: 50px;
            padding: 0 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-light);
            font-size: 16px;
            -webkit-appearance: none;
            width: 100%;
        }

        .layui-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74,144,226,0.2);
        }

        .action-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 28px;
        }

        .layui-btn {
            min-width: 0;
            height: 50px;
            border-radius: 10px;
            font-weight: 500;
            flex: 1;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .layui-btn-normal {
            background: var(--primary-color);
            border: none;
            color: #fff;
        }

        .layui-btn-normal:active {
            background: var(--primary-hover);
        }

        .layui-btn-primary {
            background: #f0f3f8;
            color: #333;
            border: 1px solid var(--border-color);
        }

        .helper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
            font-size: 15px;
        }

        .helper a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #eef3fb, transparent);
            margin: 24px 0;
        }

        .input-error {
            border-color: var(--error-color);
        }

        .error-msg {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted-color);
            font-size: 18px;
            cursor: pointer;
            z-index: 2;
        }

        .password-container {
            position: relative;
        }

        /* 移动设备优化 */
        @media (max-width: 480px) {
            body {
                padding: 16px;
                padding-top: 30px; /* 移动端顶部间距 */
                justify-content: flex-start; /* 顶部对齐 */
            }

            .panel {
                margin: 0 auto;
                padding: 20px 18px;
                border-radius: 10px;
            }

            .panel-header {
                margin-bottom: 22px;
            }

            .panel-header .icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .panel-header h2 {
                font-size: 20px;
            }

            .panel-desc {
                font-size: 13px;
            }

            .layui-input {
                height: 48px;
                font-size: 16px; /* 防止iOS缩放 */
            }

            .layui-btn {
                height: 48px;
            }

            .action-row {
                flex-direction: column;
                gap: 12px;
            }

            .layui-btn {
                width: 100%;
            }
        }

        /* 防止iOS输入框圆角 */
        input {
            border-radius: 10px;
        }

        /* 顶部间距调整 */
        @media (min-height: 700px) {
            body {
                padding-top: 60px;
            }
        }

        @media (min-height: 800px) {
            body {
                padding-top: 80px;
            }
        }

        @media (min-height: 900px) {
            body {
                padding-top: 100px;
            }
        }
    </style>
</head>
<body>
<div class="panel" role="region" aria-label="修改密码表单">
    <div class="panel-header">
        <div class="icon">🔒</div>
        <div>
            <h2>修改密码</h2>
            <div class="panel-desc">请输入手机号、原密码与新密码，并确认以完成修改</div>
        </div>
    </div>

    <form class="layui-form" id="passwordForm" lay-filter="passwordForm" autocomplete="off">
        <div class="layui-form-item">
            <label for="phone" class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input id="phone" type="tel" inputmode="tel" name="phone" placeholder="请输入手机号" class="layui-input" autocomplete="tel" />
                <div class="error-msg" id="phone-error"></div>
            </div>
        </div>

        <div class="layui-form-item">
            <label for="oldPass" class="layui-form-label">原密码</label>
            <div class="layui-input-block password-container">
                <input id="oldPass" type="password" name="pass" placeholder="请输入当前密码" class="layui-input" autocomplete="current-password" />
                <button type="button" class="password-toggle" aria-label="显示密码">👁️</button>
                <div class="error-msg" id="oldPass-error"></div>
            </div>
        </div>

        <div class="layui-form-item">
            <label for="newPass" class="layui-form-label">新密码</label>
            <div class="layui-input-block password-container">
                <input id="newPass" type="password" name="pass1" placeholder="请输入新密码（至少8位，包含字母和数字）" class="layui-input" autocomplete="new-password" />
                <button type="button" class="password-toggle" aria-label="显示密码">👁️</button>
                <div class="error-msg" id="newPass-error"></div>
            </div>
        </div>

        <div class="layui-form-item">
            <label for="confirmPass" class="layui-form-label">确认新密码</label>
            <div class="layui-input-block password-container">
                <input id="confirmPass" type="password" name="pass2" placeholder="请再次输入新密码" class="layui-input" autocomplete="new-password" />
                <button type="button" class="password-toggle" aria-label="显示密码">👁️</button>
                <div class="error-msg" id="confirmPass-error"></div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-input-block action-row">
                <button id="saveBtn" type="button" class="layui-btn layui-btn-normal" lay-filter="save">保存</button>
                <button id="cancelBtn" type="button" class="layui-btn layui-btn-primary">取消</button>
            </div>
        </div>
    </form>

    <div class="divider"></div>

    <div class="helper" aria-live="polite">
        <a href="login.html">修改成功，立即登录</a>
    </div>
</div>

<script>
    layui.use(['form','layer'], function(){
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.jquery;

        // 密码显示/隐藏功能
        $('.password-toggle').on('touchstart click', function(e) {
            e.preventDefault();
            var $this = $(this);
            var $input = $this.prevAll('input');
            var type = $input.attr('type');

            if (type === 'password') {
                $input.attr('type', 'text');
                $this.text('🔒');
            } else {
                $input.attr('type', 'password');
                $this.text('👁️');
            }
        });

        // 输入验证函数
        function validateField($field, validator, errorMsg) {
            var value = $.trim($field.val());
            var $error = $('#' + $field.attr('id') + '-error');

            if (!validator(value)) {
                $field.addClass('input-error');
                $error.show().text(errorMsg);
                return false;
            } else {
                $field.removeClass('input-error');
                $error.hide();
                return true;
            }
        }

        // 手机号验证
        function validatePhone(phone) {
            return /^1[3-9]\d{9}$/.test(phone);
        }

        // 密码验证
        function validatePassword(pass) {
            return pass.length >= 8 && /[A-Za-z]/.test(pass) && /\d/.test(pass);
        }

        // 实时验证
        $('#phone').on('input', function() {
            validateField($(this), validatePhone, '请输入有效的手机号');
        });

        $('#newPass').on('input', function() {
            validateField($(this), validatePassword, '密码至少8位，且包含字母和数字');

            // 同时验证确认密码
            var confirmPass = $('#confirmPass').val();
            if (confirmPass) {
                validateField($('#confirmPass'), function(val) {
                    return val === $('#newPass').val();
                }, '两次输入的新密码不一致');
            }
        });

        $('#confirmPass').on('input', function() {
            validateField($(this), function(val) {
                return val === $('#newPass').val();
            }, '两次输入的新密码不一致');
        });

        // 回车快捷提交
        $('#passwordForm').on('keydown', 'input', function(e){
            if (e.key === 'Enter') {
                e.preventDefault();
                $('#saveBtn').trigger('click');
            }
        });

        // 取消按钮：清空表单或关闭弹窗
        $('#cancelBtn').on('click', function(){
            try {
                var idx = parent.layer.getFrameIndex(window.name);
                if (idx !== undefined) {
                    parent.layer.close(idx);
                    return;
                }
            } catch (e) { /* 忽略 */ }
            $('#passwordForm')[0].reset();
            $('.input-error').removeClass('input-error');
            $('.error-msg').hide();
        });

        var saving = false;
        $('#saveBtn').on('click', function(){
            if (saving) return;

            // 验证所有字段
            var phoneValid = validateField($('#phone'), validatePhone, '请输入有效的手机号');
            var oldPassValid = validateField($('#oldPass'), function(val) { return val.length > 0; }, '请输入当前密码');
            var newPassValid = validateField($('#newPass'), validatePassword, '密码至少8位，且包含字母和数字');
            var confirmPassValid = validateField($('#confirmPass'), function(val) {
                return val === $('#newPass').val();
            }, '两次输入的新密码不一致');

            if (!(phoneValid && oldPassValid && newPassValid && confirmPassValid)) {
                // 滚动到第一个错误
                var $firstError = $('.input-error').first();
                if ($firstError.length) {
                    $('html, body').animate({
                        scrollTop: $firstError.offset().top - 100
                    }, 300);
                }
                return;
            }

            saving = true;
            var $btn = $('#saveBtn');
            $btn.prop('disabled', true).text('保存中...');

            var payload = {
                phone: $('#phone').val(),
                pass: $('#oldPass').val(),
                pass1: $('#newPass').val(),
                pass2: $('#confirmPass').val()
            };

            // 通过现有 ajax_post 封装提交
            try {
                ajax_post('/client/updatepass', payload, function(json){
                    saving = false;
                    $btn.prop('disabled', false).text('保存');

                    if (json && (json.status > 0 || json.code === 0 || json.success === true)) {
                        layer.msg(json.msg || '密码更新成功', {icon:1, time:1400}, function(){
                            try {
                                var idx = parent.layer.getFrameIndex(window.name);
                                if (idx !== undefined) {
                                    parent.layer.close(idx);
                                    if (parent && parent.location) parent.location.reload();
                                    return;
                                }
                            } catch(e) {}
                        });
                    } else {
                        var msg = (json && (json.msg || json.message)) ? (json.msg || json.message) : '密码修改失败';
                        layer.msg(msg, {icon:5});
                    }
                }, function(err){
                    saving = false;
                    $btn.prop('disabled', false).text('保存');
                    layer.msg('网络错误，请稍后重试', {icon:2});
                });
            } catch (e) {
                // 如果环境未提供 ajax_post，回退到 jQuery
                $.ajax({
                    url: '/client/updatepass',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    success: function(json){
                        saving = false;
                        $btn.prop('disabled', false).text('保存');
                        if (json && (json.status > 0 || json.code === 0 || json.success === true)) {
                            layer.msg(json.msg || '密码更新成功', {icon:1, time:1400}, function(){
                                try {
                                    var idx = parent.layer.getFrameIndex(window.name);
                                    if (idx !== undefined) {
                                        parent.layer.close(idx);
                                        parent.location.reload();
                                        return;
                                    }
                                } catch(e) {}
                            });
                        } else {
                            var msg = (json && (json.msg || json.message)) ? (json.msg || json.message) : '密码修改失败';
                            layer.msg(msg, {icon:5});
                        }
                    },
                    error: function(xhr){
                        saving = false;
                        $btn.prop('disabled', false).text('保存');
                        if (xhr && xhr.status === 401) {
                            layer.msg('登录已过期，请重新登录', {icon:5}, function(){
                                location.href = '/login.html';
                            });
                        } else {
                            layer.msg('网络或服务器错误，请稍后重试', {icon:2});
                        }
                    }
                });
            }
        });
    });
</script>
</body>
</html>
