<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>医疗健康管理系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/layui@2.6.8/dist/css/layui.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --primary-light: #e8f4ff;
            --secondary-color: #2ecc71;
            --text-color: #2c3e50;
            --text-light: #7f8c8d;
            --border-color: #e6eaee;
            --bg-light: #f8fafc;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ecf0f1;
            --sidebar-hover: #34495e;
            --sidebar-active: #3498db;
            --header-bg: linear-gradient(135deg, var(--primary-color), #2980b9);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-color);
            background-color: var(--bg-light);
            line-height: 1.6;
        }

        /* 布局样式 */
        .layout-container {
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏样式 - 已优化可读性 */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--primary-color);
            overflow: hidden;
        }

        .user-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
        .user-avatar i {
            font-size: 32px;
            color: var(--primary-color);
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            color: white;
        }

        .user-status {
            font-size: 13px;
            color: var(--sidebar-text);
            opacity: 0.9;
        }

        .user-level {
            display: inline-block;
            padding: 3px 10px;
            background: linear-gradient(to right, #f39c12, #e67e22);
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 8px;
        }

        /* 导航菜单 */
        .sidebar-nav {
            flex: 1;
            padding: 15px 0;
            overflow-y: auto;
        }

        .nav-item {
            margin-bottom: 5px;
            position: relative;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .nav-item a:hover, .nav-item a.active {
            background: var(--sidebar-hover);
            color: white;
            border-left-color: var(--primary-color);
        }

        .nav-item i {
            margin-right: 12px;
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .nav-item .fa-chevron-down {
            margin-left: auto;
            font-size: 12px;
            transition: transform 0.3s;
        }

        .nav-item.expanded .fa-chevron-down {
            transform: rotate(180deg);
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background: rgba(0, 0, 0, 0.06);
            padding: 0 0;
        }

        .nav-item.expanded .submenu {
            max-height: 500px;
            padding: 8px 0;
        }

        .submenu a {
            padding: 12px 20px 12px 60px;
            font-size: 14px;
            font-weight: normal;
            border-left: none;
            position: relative;
            display: block;
            color: var(--sidebar-text);
            text-decoration: none;
        }

        .submenu a:hover {
            color: white;
            background: rgba(255,255,255,0.04);
        }

        .submenu a:before {
            content: '';
            position: absolute;
            left: 40px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--sidebar-text);
            opacity: 0.6;
            transform: translateY(-50%);
        }

        .submenu a:hover:before, .submenu a.active:before {
            background: var(--primary-color);
            opacity: 1;
        }

        .menu-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #e74c3c;
            color: white;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 8px;
            line-height: 1.3;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 头部样式 */
        .header {
            background: var(--header-bg);
            color: white;
            padding: 0 20px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 90;
        }

        .header-title {
            font-size: 22px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        .toggle-sidebar {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            transition: all 0.2s;
        }

        .toggle-sidebar:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .user-menu {
            position: relative;
        }

        .user-menu-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-menu-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .user-menu-btn img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow);
            width: 180px;
            padding: 10px 0;
            margin-top: 10px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.2s;
        }

        .user-menu.active .user-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-dropdown a {
            display: block;
            padding: 10px 20px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .user-dropdown a:hover {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        /* 内容区域 */
        .content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .dashboard-panel {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-message h1 {
            font-size: 28px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .welcome-message p {
            font-size: 16px;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 24px;
            color: white;
        }

        .stat-content {
            flex: 1;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-light);
        }

        /* 响应式设计 */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                left: -260px;
                height: 100vh;
            }

            .sidebar.mobile-visible {
                left: 0;
            }

            .sidebar.collapsed {
                width: 260px;
                left: -260px;
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 99;
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s;
            }

            .overlay.visible {
                opacity: 1;
                visibility: visible;
            }
        }

        @media (max-width: 576px) {
            .header-title {
                font-size: 18px;
            }

            .content {
                padding: 15px;
            }

            .dashboard-panel {
                padding: 20px;
            }

            .stats-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<script>
    (function(){
        // 配置：API 根路径和字段映射
        var API_BASE = '/client/'; // 与个人中心页面一致
        function getUserId() {
            return localStorage.getItem('id') || localStorage.getItem('userId') || null;
        }

        function safeText(val, fallback) {
            if (val === null || val === undefined || val === '') return fallback || '-';
            return String(val);
        }

        function formatDateSimple(d) {
            if (!d) {
                var now = new Date();
                var Y = now.getFullYear(), M = ('0'+(now.getMonth()+1)).slice(-2), D = ('0'+now.getDate()).slice(-2);
                return Y + '年' + M + '月' + D + '日';
            }
            var dt = new Date(d);
            if (isNaN(dt.getTime())) return d;
            var Y = dt.getFullYear(), M = ('0'+(dt.getMonth()+1)).slice(-2), D = ('0'+dt.getDate()).slice(-2);
            return Y + '年' + M + '月' + D + '日';
        }

        function renderUserToPage(data) {
            if (!data) return;
            // 名称与头像
            var name = data.nike || data.name || data.username || data.userName || '-';
            var avatar = data.avatar || data.avatarUrl || data.headimg || data.avatar_url || null;
            var level = data.levelName || data.level_name || data.level || null;
            var points = data.point !== undefined ? data.point : (data.points !== undefined ? data.points : null);
            var packageName = data.cardName || data.card_name || (data.card?data.card.name:null) || null;

            // header & sidebar
            document.getElementById('headerUserName').textContent = safeText(name, '用户');
            document.getElementById('sidebarName').textContent = safeText(name, '张三');
            if (avatar) {
                var headerImg = document.getElementById('headerAvatar');
                headerImg.src = avatar;
                headerImg.alt = safeText(name,'用户头像');

                var sideAvatar = document.getElementById('sidebarAvatar');
                sideAvatar.innerHTML = '';
                var img = document.createElement('img');
                img.src = avatar;
                img.alt = '头像';
                sideAvatar.appendChild(img);
            }

            if (level) document.getElementById('sidebarLevel').textContent = level;
            if (points !== null) document.getElementById('sidebarPoints').textContent = '积分: ' + points;
            if (packageName) document.getElementById('sidebarPackage').textContent = '套餐: ' + packageName;

            // 欢迎信息（包含日期和个性化提示）
            var todayStr = formatDateSimple();
            var pending = (data.pendingAppointments !== undefined)? data.pendingAppointments : (data.pending_appointments !== undefined? data.pending_appointments : null);
            var reports = (data.newReports !== undefined)? data.newReports : (data.new_reports !== undefined? data.new_reports : null);
            var health = (data.healthScore !== undefined)? data.healthScore : (data.health_score !== undefined? data.health_score : null);

            // 如果后端没有提供这些统计数据，可以尝试从 data.statistics 或 data.stats 中读取通用字段
            if (pending === null && data.statistics && (data.statistics.pendingAppointments!==undefined || data.statistics.pending_appointments!==undefined)) {
                pending = data.statistics.pendingAppointments || data.statistics.pending_appointments;
            }
            if (reports === null && data.statistics && (data.statistics.newReports!==undefined || data.statistics.new_reports!==undefined)) {
                reports = data.statistics.newReports || data.statistics.new_reports;
            }
            if (health === null && data.statistics && (data.statistics.healthScore!==undefined || data.statistics.health_score!==undefined)) {
                health = data.statistics.healthScore || data.statistics.health_score;
            }

            // 回退默认值
            if (pending === null) pending = 2;
            if (reports === null) reports = 1;
            if (health === null) health = '98%';

            document.getElementById('welcomeTitle').textContent = '欢迎回来，' + safeText(name, '用户') + '！';
            document.getElementById('welcomeSubtitle').textContent = '今天是' + todayStr + '，祝您健康快乐！您有' + pending + '个待处理的预约和' + reports + '份新的健康报告。';

            // 统计卡更新
            document.getElementById('statAppointments').textContent = pending;
            document.getElementById('statNewReports').textContent = reports;
            document.getElementById('statHealthScore').textContent = (typeof health === 'number')? (health + '%') : String(health);

            // 最近活动简短替换（可从 data.activities 或 data.recent 中读取）
            var recentText = '这里显示最近的健康活动记录、预约信息和报告更新等。';
            if (data.recent && Array.isArray(data.recent) && data.recent.length>0) {
                recentText = data.recent.slice(0,3).map(function(item){
                    var t = item.title || item.name || item.action || item.event || '';
                    var d = item.date || item.createDate || item.created_at || '';
                    return (t? (t + (d? (' — ' + formatDateSimple(d)) : '')) : JSON.stringify(item));
                }).join('； ');
            } else if (data.activities && Array.isArray(data.activities) && data.activities.length>0) {
                recentText = data.activities.slice(0,3).map(function(it){ return (it.title||it.desc||it.name||'活动') + (it.date?(' — '+formatDateSimple(it.date)):''); }).join('； ');
            }
            document.getElementById('recentActivities').textContent = recentText;
        }

        function loadAndRender() {
            var id = getUserId();
            if (!id) {
                console.warn('未检测到用户 id，页面保持静态默认显示。');
                return;
            }
            var url = API_BASE + 'get?id=' + encodeURIComponent(id);
            // 使用 fetch 请求
            fetch(url, { method: 'GET', credentials: 'same-origin' })
                .then(function(resp){
                    if (!resp.ok) throw new Error('Network response was not ok: ' + resp.status);
                    return resp.json().catch(function(){ return null; });
                })
                .then(function(json){
                    if (!json) { console.warn('返回非 JSON 或空，保留静态显示'); return; }
                    var data = json;
                    // 如果为标准的 {code:0, data: {...}} 风格，取 data
                    if (json.code !== undefined) {
                        if (json.code === 0) {
                            if (Array.isArray(json.data)) data = json.data.length? json.data[0] : {};
                            else data = json.data || {};
                        } else {
                            console.warn('接口返回错误：', json.msg || json);
                            return;
                        }
                    } else if (json.status !== undefined) {
                        // 兼容老接口风格 R
                        if (json.status === 0 || json.success === true) {
                            data = json.data || {};
                        } else {
                            console.warn('接口返回错误（status）：', json);
                            return;
                        }
                    }
                    renderUserToPage(data);
                })
                .catch(function(err){
                    console.error('获取用户信息失败：', err);
                    // 保留静态显示
                });
        }

        // 绑定交互脚本（原页面保留）
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const toggleSidebar = document.getElementById('toggleSidebar');
            const userMenu = document.getElementById('userMenu');
            const overlay = document.getElementById('overlay');

            // 切换侧边栏
            toggleSidebar.addEventListener('click', function(e) {
                if (window.innerWidth < 992) {
                    sidebar.classList.toggle('mobile-visible');
                    overlay.classList.toggle('visible');
                } else {
                    sidebar.classList.toggle('collapsed');
                }
            });

            overlay.addEventListener('click', function() {
                sidebar.classList.remove('mobile-visible');
                overlay.classList.remove('visible');
            });

            const userBtn = userMenu.querySelector('.user-menu-btn');
            userBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                userMenu.classList.toggle('active');
            });

            document.addEventListener('click', function(e) {
                if (!userMenu.contains(e.target)) {
                    userMenu.classList.remove('active');
                }
            });

            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                const parentLink = item.querySelector('a');
                const submenu = item.querySelector('.submenu');

                if (submenu && parentLink) {
                    parentLink.addEventListener('click', function(e) {
                        e.preventDefault();
                        const isExpanded = item.classList.toggle('expanded');
                        if (window.innerWidth < 992) {
                            if (isExpanded) {
                                sidebar.classList.add('mobile-visible');
                                overlay.classList.add('visible');
                            }
                        }
                    });
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth >= 992) {
                    sidebar.classList.remove('mobile-visible');
                    overlay.classList.remove('visible');
                } else {
                    if (sidebar.classList.contains('collapsed')) {
                        sidebar.classList.remove('collapsed');
                    }
                }
            });

            const submenuLinks = document.querySelectorAll('.submenu a');
            submenuLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            });

            // 加载并渲染用户数据
            loadAndRender();
        });

    })();
</script>
</body>
</html>
