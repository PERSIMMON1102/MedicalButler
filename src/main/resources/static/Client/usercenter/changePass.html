<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗健康管理系统 - 修改密码</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.6.8/dist/css/layui.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4a90e2;
            --primary-dark: #3578c6;
            --success: #52c41a;
            --warning: #f59e0b;
            --danger: #f44336;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2d3d;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft Yahei', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4a90e2 0%, #3578c6 100%);
            color: white;
            padding: 28px;
            text-align: center;
            position: relative;
        }

        .header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .body {
            padding: 30px;
        }

        .form-item {
            margin-bottom: 24px;
        }

        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            z-index: 2;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            border-radius: 10px;
            border: 2px solid var(--border);
            font-size: 16px;
            transition: all 0.3s;
            background: #fafbfc;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
            outline: none;
            background: #fff;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--muted);
            user-select: none;
        }

        .password-strength {
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .password-strength-inner {
            height: 100%;
            width: 0;
            transition: all 0.3s;
            border-radius: 3px;
        }

        .strength-0 { width: 20%; background: var(--danger); }
        .strength-1 { width: 40%; background: #ff9800; }
        .strength-2 { width: 60%; background: #ffc107; }
        .strength-3 { width: 80%; background: #8bc34a; }
        .strength-4 { width: 100%; background: var(--success); }

        .hint {
            font-size: 13px;
            color: var(--muted);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover { background: var(--primary-dark); }

        .btn-secondary {
            background: #f0f2f5;
            color: var(--muted);
        }

        .btn-secondary:hover { background: #e5e7eb; }

        .footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 14px;
        }

        .footer a { color: var(--primary); text-decoration: none; }

        .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .success {
            color: var(--success);
            font-size: 13px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 520px) {
            .body { padding: 20px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fas fa-lock"></i> 修改密码</h2>
        <p>请填写以下信息以修改您的密码</p>
    </div>

    <div class="body">
        <div class="form-item">
            <label for="phone"><i class="fas fa-mobile-alt"></i> 手机号码</label>
            <div class="input-wrapper">
                <i class="fas fa-phone"></i>
                <input type="tel" id="phone" placeholder="请输入您的手机号码" autocomplete="tel">
            </div>
            <div class="hint">
                <i class="fas fa-info-circle"></i> 请输入您账号绑定的手机号码
            </div>
        </div>

        <div class="form-item">
            <label for="currentPassword"><i class="fas fa-key"></i> 原密码</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="currentPassword" placeholder="请输入原密码" autocomplete="current-password">
                <span class="password-toggle" id="toggleCurrentPassword" title="显示/隐藏密码">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
        </div>

        <div class="form-item">
            <label for="newPassword"><i class="fas fa-key"></i> 新密码</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="newPassword" placeholder="请输入新密码" autocomplete="new-password">
                <span class="password-toggle" id="toggleNewPassword" title="显示/隐藏密码">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            <div class="password-strength">
                <div class="password-strength-inner" id="passwordStrength"></div>
            </div>
            <div class="hint">
                <i class="fas fa-info-circle"></i> 密码至少8位，包含字母和数字
            </div>
        </div>

        <div class="form-item">
            <label for="confirmPassword"><i class="fas fa-key"></i> 确认新密码</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="请再次输入新密码" autocomplete="new-password">
                <span class="password-toggle" id="toggleConfirmPassword" title="显示/隐藏密码">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            <div class="hint" id="confirmHint"></div>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" id="btnCancel" type="button">
                <i class="fas fa-arrow-left"></i> 取消
            </button>
            <button class="btn btn-primary" id="btnSubmit" type="button">
                <i class="fas fa-check"></i> 确认修改
            </button>
        </div>
    </div>

    <div class="footer">
        <p>遇到问题？请联系 <a href="#">客服支持</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.6.8/dist/layui.js"></script>
<script>
    // API 基础路径（与后端映射）
    var API_BASE = '/client/';

    // 获取当前用户 ID（如本地存储有）
    function getUserId() {
        return localStorage.getItem('id') || localStorage.getItem('userId') || '';
    }

    document.addEventListener('DOMContentLoaded', function() {
        var layer = layui.layer;
        var $ = layui.$;

        // 密码显示/隐藏切换
        function setupPasswordToggle(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);

            if (!toggle || !input) return;

            toggle.addEventListener('click', function() {
                if (input.type === 'password') {
                    input.type = 'text';
                    toggle.innerHTML = '<i class="fas fa-eye-slash"></i>';
                } else {
                    input.type = 'password';
                    toggle.innerHTML = '<i class="fas fa-eye"></i>';
                }
            });
        }

        setupPasswordToggle('toggleCurrentPassword', 'currentPassword');
        setupPasswordToggle('toggleNewPassword', 'newPassword');
        setupPasswordToggle('toggleConfirmPassword', 'confirmPassword');

        // 密码强度检测
        const newPasswordInput = document.getElementById('newPassword');
        const strengthBar = document.getElementById('passwordStrength');

        if (newPasswordInput) {
            newPasswordInput.addEventListener('input', function() {
                const password = this.value;
                let strength = 0;

                if (password.length >= 8) strength++;
                if (/[A-Z]/.test(password)) strength++;
                if (/[a-z]/.test(password)) strength++;
                if (/[0-9]/.test(password)) strength++;
                if (/[^A-Za-z0-9]/.test(password)) strength++;

                // Map strength (0-5) to 0-4 classes
                strengthBar.className = 'password-strength-inner strength-' + Math.min(strength, 4);
            });
        }

        // 确认密码验证
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const confirmHint = document.getElementById('confirmHint');

        if (confirmPasswordInput) {
            confirmPasswordInput.addEventListener('input', function() {
                const newPassword = newPasswordInput ? newPasswordInput.value : '';
                const confirmPassword = this.value;

                if (confirmPassword.length === 0) {
                    confirmHint.innerHTML = '';
                    confirmHint.className = 'hint';
                    return;
                }

                if (newPassword === confirmPassword) {
                    confirmHint.innerHTML = '<i class="fas fa-check-circle"></i> 密码匹配';
                    confirmHint.className = 'success';
                } else {
                    confirmHint.innerHTML = '<i class="fas fa-times-circle"></i> 密码不匹配';
                    confirmHint.className = 'error';
                }
            });
        }

        // 手机号验证与格式化
        const phoneInput = document.getElementById('phone');
        if (phoneInput) {
            phoneInput.addEventListener('input', function() {
                const phone = this.value;
                if (phone && !isValidPhone(phone)) {
                    this.style.borderColor = 'var(--danger)';
                } else {
                    this.style.borderColor = '';
                }
            });
        }

        function isValidPhone(phone) {
            const tel = normalizePhone(phone);
            return /^(?:\+?86)?1[3-9]\d{9}$/.test(tel);
        }

        function normalizePhone(raw) {
            let tel = String(raw || '');
            tel = tel.replace(/^[\s\u00A0\u3000]+|[\s\u00A0\u3000]+$/g, '');
            tel = tel.replace(/[\s\-\_]/g, '');
            tel = tel.replace(/[\uFF10-\uFF19]/g, function(c) {
                return String.fromCharCode(c.charCodeAt(0) - 0xFF10 + 48);
            });
            tel = tel.replace(/^\uFF0B/, '+');
            return tel;
        }

        // 通用 POST JSON 请求（带超时与错误处理）
        function postJson(url, data, timeout = 10000) {
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', url, true);
                xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

                // 如需传递登录 token（例如 Authorization: Bearer <token>），可在此添加：
                // var token = localStorage.getItem('token');
                // if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);

                xhr.onreadystatechange = function() {
                    if (xhr.readyState !== 4) return;
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var res = xhr.responseText ? JSON.parse(xhr.responseText) : {};
                            resolve(res);
                        } catch (e) {
                            reject(new Error('服务器返回格式不正确'));
                        }
                    } else {
                        reject(new Error('网络请求失败，状态码：' + xhr.status));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('网络错误，请检查您的网络连接'));
                };

                xhr.ontimeout = function() {
                    reject(new Error('请求超时，请重试'));
                };

                xhr.timeout = timeout;
                try {
                    xhr.send(JSON.stringify(data));
                } catch (e) {
                    reject(new Error('请求发送失败'));
                }
            });
        }

        // 表单提交逻辑：与后端 updatepass 对接（参数名：phone, pass, pass1, pass2）
        var btnSubmit = document.getElementById('btnSubmit');
        if (btnSubmit) {
            btnSubmit.addEventListener('click', function() {
                var id = getUserId();
                if (!id) {
                    layer.msg('请先登录', {icon: 2});
                    return;
                }

                var phoneVal = normalizePhone((document.getElementById('phone') || {}).value || '');
                var oldPwd = (document.getElementById('currentPassword') || {}).value || '';
                var newPwd = (document.getElementById('newPassword') || {}).value || '';
                var confirmPwd = (document.getElementById('confirmPassword') || {}).value || '';

                // 基本校验（与后端保持一致）
                if (!phoneVal) {
                    layer.msg('手机号为必填项', {icon: 2});
                    return;
                }

                if (!isValidPhone(phoneVal)) {
                    layer.msg('请输入有效的手机号（支持 +86 前缀）', {icon: 2});
                    return;
                }

                if (!oldPwd) {
                    layer.msg('请输入原密码', {icon: 2});
                    return;
                }

                if (!newPwd) {
                    layer.msg('请输入新密码', {icon: 2});
                    return;
                }

                if (newPwd.length < 8 || !(/[A-Za-z]/.test(newPwd) && /\d/.test(newPwd))) {
                    layer.msg('新密码至少8位，且包含字母和数字', {icon: 2});
                    return;
                }

                if (newPwd !== confirmPwd) {
                    layer.msg('两次输入的新密码不一致', {icon: 2});
                    return;
                }

                // 防重复提交
                var $btn = $(btnSubmit);
                if ($btn.prop('disabled')) return;
                $btn.prop('disabled', true);
                var originalHtml = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';

                var payload = {
                    phone: phoneVal,
                    pass: oldPwd,
                    pass1: newPwd,
                    pass2: confirmPwd
                };

                postJson(API_BASE + 'updatepass', payload, 12000)
                    .then(function(res) {
                        if (res && typeof res.code !== 'undefined') {
                            if (res.code === 0) {
                                layer.msg(res.msg || '密码修改成功', {icon: 1}, function() {
                                    // 清除本地登录信息并跳转到登录页
                                    localStorage.removeItem('id');
                                    localStorage.removeItem('userId');
                                    // 如保存有 token 等也一并清理
                                    localStorage.removeItem('token');
                                    window.location.href = '/login.html';
                                });
                            } else {
                                layer.msg(res.msg || '修改失败', {icon: 2});
                            }
                        } else {
                            layer.msg('服务器返回异常，请稍后重试', {icon: 2});
                        }
                    })
                    .catch(function(err) {
                        console.error(err);
                        layer.msg(err.message || '网络错误，请稍后重试', {icon: 2});
                    })
                    .finally(function() {
                        // 恢复按钮状态（若页面跳转，这一行不会被看到）
                        $btn.prop('disabled', false);
                        btnSubmit.innerHTML = originalHtml;
                    });
            });
        }

        // 取消按钮
        var btnCancel = document.getElementById('btnCancel');
        if (btnCancel) {
            btnCancel.addEventListener('click', function() {
                window.location.href = 'userCenter.html';
            });
        }
    });
</script>
</body>
</html>
